name: Daily economic briefing
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish after all checks (leave false for setup)'
        type: boolean
        default: false
  schedule:
    - cron: '11,31,51 21 * * *'
    - cron: '17 22 * * *'
concurrency:
  group: daily-threads
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Skip a day already published or pending
        id: day
        run: |
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone, timedelta
          from pathlib import Path
          day = datetime.now(timezone(timedelta(hours=9))).date().isoformat()
          path = Path('.state') / (day + '.json')
          skip = False
          if path.exists():
              receipt = json.loads(path.read_text())
              skip = receipt.get('date') == day and receipt.get('status') in ('published', 'prepared')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('skip=' + str(skip).lower() + '\n')
          print('Existing published/pending receipt: skip' if skip else 'No publication yet: prepare fresh briefing')
          PY
      - uses: actions/setup-python@v5
        if: steps.day.outputs.skip != 'true'
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
        if: steps.day.outputs.skip != 'true'
      - run: pip install -r requirements.txt
        if: steps.day.outputs.skip != 'true'
      - run: python -m unittest discover -p 'test_*.py' -v
        if: steps.day.outputs.skip != 'true'
      - name: Create and review today's briefing
        if: steps.day.outputs.skip != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.1-flash-lite
          GEMINI_VISION_MODEL: gemini-3.1-flash-lite
        run: python briefing.py
      - name: Export review without copies of source articles
        if: steps.day.outputs.skip != 'true' && (always())
        run: |
          python - <<'PY'
          import json,shutil
          from pathlib import Path
          def public(value):
              if isinstance(value,dict):
                  return {k:public(v) for k,v in value.items() if k not in ('article_text','excerpt','evidence_quotes')}
              if isinstance(value,list):
                  return [public(v) for v in value]
              return value
          target=Path('review-export'); target.mkdir(exist_ok=True)
          for path in Path('build').glob('*'):
              if path.suffix=='.json':
                  (target/path.name).write_text(json.dumps(public(json.loads(path.read_text())),ensure_ascii=False,indent=2),encoding='utf-8')
              elif path.suffix=='.png':
                  shutil.copyfile(path,target/path.name)
          PY
      - uses: actions/upload-artifact@v4
        if: steps.day.outputs.skip != 'true' && (always())
        with:
          name: briefing-review
          path: review-export/
          retention-days: 3
      - name: Verify image processing without publishing
        if: steps.day.outputs.skip != 'true' && (github.event_name == 'workflow_dispatch' && !inputs.publish)
        env:
          ENABLE_PUBLISH: 'preview'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
          THREADS_USERNAME: lej0954
        run: python publish.py
      - name: Publish with durable receipt
        if: steps.day.outputs.skip != 'true' && (github.event_name == 'schedule' || inputs.publish)
        env:
          ENABLE_PUBLISH: 'true'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
          THREADS_USERNAME: lej0954
          THREADS_USER_ID: ${{ vars.THREADS_USER_ID }}
        run: python publish.py
