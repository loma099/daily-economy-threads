name: Daily economic briefing
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish after all checks (leave false for setup)'
        type: boolean
        default: false
  schedule:
    - cron: '35 21 * * *'
concurrency:
  group: daily-threads
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  prepare:
    if: vars.ENABLE_DAILY == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -p 'test_*.py' -v
      - name: Create and review today's briefing
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
        run: python briefing.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: briefing-review
          path: build/
          retention-days: 3
      - name: Publish with durable receipt
        if: vars.ENABLE_DAILY == 'true' && (github.event_name == 'schedule' || inputs.publish)
        env:
          ENABLE_PUBLISH: 'true'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
          THREADS_USERNAME: lej0954
          THREADS_USER_ID: ${{ vars.THREADS_USER_ID }}
        run: python publish.py
