name: Daily economic briefing
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish after all checks (leave false for setup)'
        type: boolean
        default: false
  schedule:
    - cron: '35 21 * * *'
concurrency:
  group: daily-threads
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -p 'test_*.py' -v
      - name: Create and review today's briefing
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.8-flash
          GEMINI_VISION_MODEL: gemini-3.1-flash-lite
        run: python briefing.py
      - name: Export review without copies of source articles
        if: always()
        run: |
          python - <<'PY'
          import json,shutil
          from pathlib import Path
          def public(value):
              if isinstance(value,dict):
                  return {k:public(v) for k,v in value.items() if k not in ('article_text','excerpt','evidence_quotes')}
              if isinstance(value,list):
                  return [public(v) for v in value]
              return value
          target=Path('review-export'); target.mkdir(exist_ok=True)
          for path in Path('build').glob('*'):
              if path.suffix=='.json':
                  (target/path.name).write_text(json.dumps(public(json.loads(path.read_text())),ensure_ascii=False,indent=2),encoding='utf-8')
              elif path.suffix=='.png':
                  shutil.copyfile(path,target/path.name)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: briefing-review
          path: review-export/
          retention-days: 3
      - name: Verify image processing without publishing
        if: github.event_name == 'workflow_dispatch' && !inputs.publish
        env:
          ENABLE_PUBLISH: 'preview'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
          THREADS_USERNAME: lej0954
        run: python publish.py
      - name: Publish with durable receipt
        if: github.event_name == 'schedule' || inputs.publish
        env:
          ENABLE_PUBLISH: 'true'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
          THREADS_USERNAME: lej0954
          THREADS_USER_ID: ${{ vars.THREADS_USER_ID }}
        run: python publish.py
